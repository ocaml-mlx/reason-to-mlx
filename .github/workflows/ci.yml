name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["5.5"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam install . --deps-only --with-test --yes
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - run: opam install . --deps-only --with-test --yes
      - run: opam install dune-release --yes
      - uses: davesnx/dune-release-action@v0.6.0
        with:
          packages: reason-to-mlx
          changelog: ./CHANGES.md
          github-token: ${{ secrets.GH_TOKEN || github.token }}
          to-opam-repository: ${{ secrets.GH_TOKEN != '' }}
          pr-preamble-message: "Released automatically by dune-release-action. Contact @davesnx"
